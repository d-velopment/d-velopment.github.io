<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Find public street parking in Tallinn's Kesklinn zone for vehicles with a valid EV permit."
    >
    <meta name="theme-color" content="#f6f8f5">
    <title>Kesklinn Parking Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="./styles.css">
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin="anonymous"
      defer
    ></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">P</span>
        <div>
          <p class="eyebrow">Tallinn · EV parking</p>
          <h1>Kesklinn Parking Map</h1>
        </div>
      </div>

      <button
        class="location-button"
        id="location-button"
        type="button"
        aria-pressed="false"
        disabled
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="7"></circle>
          <circle cx="12" cy="12" r="2"></circle>
          <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
        </svg>
        <span id="location-label">Follow my location</span>
      </button>
    </header>

    <main class="map-frame">
      <div id="map" aria-label="Map of Kesklinn street parking"></div>
      <div id="position-dot" class="position-dot" aria-hidden="true" hidden></div>

      <aside class="map-status" aria-label="Map status">
        <p id="data-status" class="data-status" role="status">Loading parking data…</p>
        <p id="location-status" class="location-status" role="status">Explore the map</p>
      </aside>

      <div id="map-error" class="map-error" role="alert" hidden></div>
      <noscript>
        <p class="map-error">Enable JavaScript to use the parking map.</p>
      </noscript>
    </main>

    <footer class="map-guide" aria-label="Map legend">
      <ul class="legend">
        <li><span class="swatch parking-swatch" aria-hidden="true"></span> EV permit parking</li>
        <li><span class="swatch zone-swatch" aria-hidden="true"></span> Resident zones T5–T12</li>
      </ul>
      <p>
        Valid Tallinn EV permit required. Follow signs on the street.
        Double-click or double-tap to open Street View.
      </p>
    </footer>
  </body>
</html>
